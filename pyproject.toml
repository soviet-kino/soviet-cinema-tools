[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soviet-cinema-tools"
version = "0.1.0"
description = "Tools for the Soviet Bloc Cinema project: schema validation and Wikidata import"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Soviet Bloc Cinema contributors" },
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "SPARQLWrapper>=2.0",
  "requests>=2.31",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
sbc-validate = "validators.cli:app"
sbc-validate-essays = "validators.essays_cli:app"
sbc-import-films = "importers.wikidata_films:app"
sbc-enrich-films = "importers.enrich_films:app"
sbc-enrich-people = "importers.enrich_people:app"
sbc-enrich-tmdb = "importers.enrich_tmdb:app"

[tool.setuptools.packages.find]
include = ["validators*", "importers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# RUF001/002/003 ругаются на кириллицу в идентификаторах, строках и комментариях
# («ambiguous unicode»). В проекте на русском это бессмысленно — отключаем.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Typer-CLI требует вызовов typer.Argument()/typer.Option() в качестве
# дефолтов параметров — это его идиома. Глушим B008 точечно.
"validators/cli.py" = ["B008"]
"validators/essays_cli.py" = ["B008"]
"importers/wikidata_films.py" = ["B008"]
"importers/enrich_films.py" = ["B008"]
"importers/enrich_people.py" = ["B008"]
"importers/enrich_tmdb.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
